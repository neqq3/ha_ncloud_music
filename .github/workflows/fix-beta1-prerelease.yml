name: Fix beta.1 prerelease

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  mark-prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Mark beta.1 as pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v2026.06.03-beta.1 --repo "$GITHUB_REPOSITORY" --prerelease
