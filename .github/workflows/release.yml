name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve Notes File
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *"-beta"* || "$TAG" == *"-alpha"* || "$TAG" == *"-rc"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Release type: pre-release"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Release type: stable"
          fi

          FILE="docs/releases/${TAG}.md"
          if [[ -f "$FILE" ]]; then
            echo "has_file=true" >> "$GITHUB_OUTPUT"
            echo "file=$FILE" >> "$GITHUB_OUTPUT"
            echo "Use notes file: $FILE"
          else
            echo "has_file=false" >> "$GITHUB_OUTPUT"
            echo "No notes file found for tag: $TAG"
          fi

      - name: Create Release From File
        if: steps.notes.outputs.has_file == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.file }}
          draft: false
          prerelease: ${{ steps.notes.outputs.prerelease }}

      - name: Create Release With Auto Notes
        if: steps.notes.outputs.has_file != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.notes.outputs.prerelease }}
